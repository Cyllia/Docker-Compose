name: Build and Test Application
# Controls when the action will run
on:
# Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: [ main ]
  pull_request:
# Triggers the workflow on push or pull request events but only for the main branch
    branches: [ main ]
# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  build_test:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    
    steps:
          - name: Checkout code
            uses: actions/checkout@v4
          - name: Set up Docker Buildx
            uses: docker/setup-buildx-action@v3
          - name: Build image for scanning
            run: cd api && docker build -t docker-compose-api:1.0.0 -f ./Dockerfile .
          - name: Build image for scanning
            run: cd mongo && docker build -t docker-compose-mongo:1.0.0 -f ./Dockerfile .
          - name: Login to Docker Hub
            uses: docker/login-action@v4
            with:
              username: ${{ vars.Name }}
              password: ${{ secrets.Token }}
          - name: Docker Scout Scan
            uses: docker/scout-action@v1
            with:
              command: cves
              image: docker-compose-api:1.0.0
              file: ./api/Dockerfile
              only-severities: critical,high
              exit-code: false
          - name: Docker Scout Scan
            uses: docker/scout-action@v1
            with:
              command: cves
              image: docker-compose-mongo:1.0.0
              file: ./mongo/Dockerfile
              only-severities: critical,high
              exit-code: false

